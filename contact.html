<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Get in touch with Bogzy Studio for questions, ideas, and collaboration.">

    <meta name="theme-color" content="#080a0f">
    <title>Bogzy Studio | Contact</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Connect With Bogzy Studio</h1>
        <p>Have an idea? Let's talk about it.</p>
    </header>

    <nav class="navbar" aria-label="Main navigation">
        <a class="site-name" href="index.html">Bogzy Studio</a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html" aria-current="page">Contact</a>
        </div>
    </nav>

    <main>
        <section id="contact">
            <h2>Send Us a Message</h2>

            <p>
                Have a question, suggestion, or project idea?
                Use the form below to get in touch.
            </p>

            <form action="#" method="post">
                <label for="fullname">Full Name</label>
                <input
                    type="text"
                    id="fullname"
                    name="fullname"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required>

                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required>

                <label for="message">Your Message</label>
                <textarea
                    id="message"
                    name="message"
                    placeholder="Tell us how we can help..."
                    rows="5"
                    required></textarea>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Bogzy Studio. All rights reserved.</p>
    </footer>

</body>
</html>
