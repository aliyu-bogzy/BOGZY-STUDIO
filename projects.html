<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Explore the UI designs, character art, game levels, and other creative work featured by Bogzy Studio.">

    <meta name="theme-color" content="#080a0f">
    <title>Bogzy Studio | Projects</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Studio Gallery &amp; Projects</h1>
        <p>A showcase of creative work and gaming concepts.</p>
    </header>

    <nav class="navbar" aria-label="Main navigation">
        <a class="site-name" href="index.html">Bogzy Studio</a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="projects.html" aria-current="page">Projects</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <main>
        <section id="gallery">
            <h2>Featured Projects</h2>

            <div class="gallery">

                <article class="gallery-item">
                    <video controls muted loop playsinline
                           preload="metadata"
                           aria-label="Preview of UI design work">
                        <source src="image/ui-vid1.mp4" type="video/mp4">
                        Your browser does not support HTML video.
                    </video>
                    <p>UI Design</p>
                </article>

                <article class="gallery-item">
                    <img src="image/Ui-designg.jpg"
                         alt="User interface and character design artwork"
                         loading="lazy">
                    <p>Character Art</p>
                </article>

                <article class="gallery-item">
                    <img src="image/game-level.jpg"
                         alt="Game environment and level design"
                         loading="lazy">
                    <p>Level Design</p>
                </article>

                <article class="gallery-item">
                    <video controls muted loop playsinline
                           preload="metadata"
                           aria-label="Multiplayer game preview">
                        <source src="image/multiplayer.mp4" type="video/mp4">
                        Your browser does not support HTML video.
                    </video>
                    <p>Multiplayer Mode</p>
                </article>

                <article class="gallery-item">
                    <img src="image/mobile.jpg"
                         alt="Mobile gaming project"
                         loading="lazy">
                    <p>Mobile Game</p>
                </article>

                <article class="gallery-item">
                    <img src="image/team.jpg"
                         alt="Bogzy Studio team"
                         loading="lazy">
                    <p>Studio Team</p>
                </article>

            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Bogzy Studio. All rights reserved.</p>
    </footer>

</body>
</html>
